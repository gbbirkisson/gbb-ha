[project]
name = "custom_components"
version = "0.7.0"
description = ""
authors = [{ name = "Guðmundur Björn Birkisson <gbb@gbb.is>" }]
readme = "README.md"
requires-python = ">=3.14.2"

[dependency-groups]
dev = [
  "pytest-cov==7.1.0",
  "pytest-homeassistant-custom-component==0.13.359",
  "ruff==0.16.5",
  "ty==0.0.77",
]

[tool.uv]
prerelease = "allow"

[tool.coverage.run]
source = ["custom_components"]

[tool.coverage.report]
exclude_lines = [
  "pragma: no cover",
  "raise NotImplemented()",
  "if __name__ == '__main__':",
  "main()",
]
show_missing = true

[tool.ruff]
line-length = 94
exclude = [".venv", "__pycache__"]

[tool.ruff.lint]
select = ["ALL"]
ignore = [
  # This project does not document with docstrings
  "D100", # undocumented-public-module
  "D101", # undocumented-public-class
  "D102", # undocumented-public-method
  "D103", # undocumented-public-function
  "D104", # undocumented-public-package
  "D107", # undocumented-public-init

  # One of each of these incompatible pairs has to go
  "D203", # incorrect-blank-line-before-class, conflicts with D211
  "D213", # multi-line-summary-second-line, conflicts with D212

  # There is a LICENSE in the repo root, no need for per file headers
  "CPY001", # missing-copyright-notice

  # Deferring these imports buys nothing, homeassistant is already imported
  "TC002", # typing-only-third-party-import
  "TC003", # typing-only-standard-library-import

  # Entities mirror the wide constructor signatures of their homeassistant bases
  "PLR0913", # too-many-arguments
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
  "ANN401",  # any-type, test helpers forward **kwargs
  "ARG001",  # unused-function-argument, fixtures requested for side effects
  "PLR2004", # magic-value-comparison, literal expectations are the point
  "S101",    # assert, that is how pytest works
  "SLF001",  # private-member-access, tests exercise entity internals on purpose
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = "tests"
norecursedirs = ".git"

[tool.ty.environment]
python = ".venv"
