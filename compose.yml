---
services:
  hass:
    image: docker.io/homeassistant/home-assistant:2026.8.3
    # `default_config` pulls in dhcp discovery, which opens an AF_PACKET raw
    # socket and fails with EPERM without this
    cap_add:
      - NET_RAW
    ports:
      - 8123:8123
    volumes:
      - hass:/config
      - ./configuration.yaml:/config/configuration.yaml
      - ./custom_components:/config/custom_components

volumes:
  hass:
